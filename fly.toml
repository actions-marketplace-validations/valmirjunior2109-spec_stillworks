# Deploy the hosted MCP server on Fly.io:
#   fly launch --copy-config --no-deploy   (pick your own app name)
#   fly deploy
# Then connect clients to https://<app>.fly.dev/mcp
app = "stillworks-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # Chromium needs room: 1 GB is the comfortable minimum
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
